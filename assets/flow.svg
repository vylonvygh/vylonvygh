<svg xmlns="http://www.w3.org/2000/svg"
     width="100%"
     height="2"
     viewBox="0 0 1000 2"
     preserveAspectRatio="none">

  <line x1="0" y1="1" x2="1000" y2="1"
        stroke="#888"
        stroke-width="1"
        stroke-dasharray="6 8">

    <animate
      attributeName="stroke-dashoffset"
      from="0"
      to="-28"
      dur="1.2s"
      repeatCount="indefinite"/>
  </line>

</svg>
